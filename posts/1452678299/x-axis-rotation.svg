<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500">
  <defs>
    <marker id="aR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/></marker>
    <marker id="aB" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/></marker>
    <marker id="aG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/></marker>
    <marker id="aRd" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/></marker>
    <marker id="aBd" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2980b9"/></marker>
    <marker id="aGd" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#1e8449"/></marker>
  </defs>
  <rect width="620" height="500" fill="#fefefe" rx="10"/>
  <text x="310" y="32" text-anchor="middle" fill="#333" font-size="18" font-weight="bold" font-family="Arial,sans-serif">绕 X 轴顺时针旋转 β — 基向量变换</text>
  <text x="310" y="52" text-anchor="middle" fill="#888" font-size="12" font-family="Arial,sans-serif">右手坐标系 · X 轴为旋转轴 · YZ 平面内旋转</text>

  <!-- Origin -->
  <circle cx="300" cy="310" r="4" fill="#333"/>

  <!-- ===== 坐标轴 ===== -->
  <!-- X: 向右 (旋转轴) -->
  <line x1="40" y1="310" x2="560" y2="310" stroke="#e74c3c" stroke-width="2.5" marker-end="url(#aR)"/>
  <text x="555" y="300" fill="#e74c3c" font-size="14" font-weight="bold" font-family="Arial,sans-serif">X</text>

  <!-- Y: 向右下 (表示穿入纸面) — 右手系: X×Y=Z, Y进入纸面 -->
  <line x1="300" y1="310" x2="355" y2="370" stroke="#3498db" stroke-width="2.2" marker-end="url(#aB)"/>
  <text x="362" y="382" fill="#3498db" font-size="14" font-weight="bold" font-family="Arial,sans-serif">Y</text>

  <!-- Z: 向上 -->
  <line x1="300" y1="310" x2="300" y2="90" stroke="#27ae60" stroke-width="2.2" marker-end="url(#aG)"/>
  <text x="312" y="85" fill="#27ae60" font-size="14" font-weight="bold" font-family="Arial,sans-serif">Z</text>

  <!-- YZ 旋转平面 (椭圆, 垂直于X轴, 穿过原点) -->
  <ellipse cx="300" cy="310" rx="30" ry="140" fill="#f2f6ff" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- ===== 基向量 î (原) = 不变 ===== -->
  <line x1="300" y1="310" x2="500" y2="310" stroke="#e74c3c" stroke-width="3.5" marker-end="url(#aR)"/>
  <text x="508" y="306" fill="#e74c3c" font-size="15" font-weight="bold" font-family="Arial,sans-serif">î = î'</text>
  <text x="508" y="324" fill="#e74c3c" font-size="12" font-family="Arial,sans-serif">(不变)</text>

  <!-- ===== 基向量 ĵ (原, Y方向) ===== -->
  <line x1="300" y1="310" x2="355" y2="370" stroke="#3498db" stroke-width="3" marker-end="url(#aB)"/>
  <text x="340" y="400" fill="#3498db" font-size="15" font-weight="bold" font-family="Arial,sans-serif">ĵ</text>

  <!-- ===== 基向量 k̂ (原, Z方向) ===== -->
  <line x1="300" y1="310" x2="300" y2="170" stroke="#27ae60" stroke-width="3" marker-end="url(#aG)"/>
  <text x="260" y="175" fill="#27ae60" font-size="15" font-weight="bold" font-family="Arial,sans-serif">k̂</text>

  <!-- ===== ĵ' (顺时针旋转β后, 从Y偏向Z) ===== -->
  <!-- j' = (0, cosβ, sinβ), β=35°: 屏幕=(300,310)+0.819*(55,60)+0.574*(0,-140)=(345,298) -->
  <line x1="300" y1="310" x2="345" y2="298" stroke="#2980b9" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#aBd)"/>
  <text x="352" y="294" fill="#2980b9" font-size="14" font-weight="bold" font-family="Arial,sans-serif">ĵ'</text>

  <!-- ===== k̂' (顺时针旋转β后, 从Z偏向-Y) ===== -->
  <!-- k' = (0, -sinβ, cosβ): 屏幕=(300,310)+(-0.574)*(55,60)+0.819*(0,-140)=(268,160) -->
  <line x1="300" y1="310" x2="268" y2="160" stroke="#1e8449" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#aGd)"/>
  <text x="228" y="158" fill="#1e8449" font-size="14" font-weight="bold" font-family="Arial,sans-serif">k̂'</text>

  <!-- 旋转弧线 -->
  <path d="M 345 355 A 62 62 0 0 1 345 298" fill="none" stroke="#e67e22" stroke-width="2.2"/>
  <text x="380" y="330" fill="#e67e22" font-size="15" font-style="italic" font-family="Arial,sans-serif">β</text>

  <path d="M 300 200 A 55 55 0 0 1 268 195" fill="none" stroke="#e67e22" stroke-width="2.2"/>
  <text x="250" y="190" fill="#e67e22" font-size="15" font-style="italic" font-family="Arial,sans-serif">β</text>

  <!-- 旋转轴标注 -->
  <text x="420" y="285" fill="#e74c3c" font-size="13" font-weight="bold" font-family="Arial,sans-serif">← 旋转轴 (X)</text>

  <!-- 图例 -->
  <g transform="translate(35, 445)">
    <line x1="0" y1="0" x2="28" y2="0" stroke="#555" stroke-width="2.5"/>
    <text x="36" y="5" fill="#555" font-size="12" font-family="Arial,sans-serif">原基向量</text>
    <line x1="130" y1="0" x2="158" y2="0" stroke="#555" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="166" y="5" fill="#555" font-size="12" font-family="Arial,sans-serif">旋转后</text>
    <text x="260" y="5" fill="#888" font-size="12" font-family="Arial,sans-serif">î 不变 · ĵ k̂ 在 YZ 平面内顺时针旋转 β</text>
  </g>
</svg>
