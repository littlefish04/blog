<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基向量变换可视化</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    min-height: 100vh;
  }

  h1 {
    font-size: 1.6rem;
    margin-bottom: 8px;
    color: #fff;
    letter-spacing: 0.02em;
  }
  .subtitle {
    font-size: 0.9rem;
    color: #888;
    margin-bottom: 20px;
  }

  .main-container {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 960px;
    width: 100%;
  }

  /* ---- Canvas ---- */
  .canvas-wrapper {
    background: #16213e;
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,.4);
  }
  canvas {
    display: block;
    border-radius: 6px;
  }

  /* ---- Control Panel ---- */
  .panel {
    background: #16213e;
    border-radius: 12px;
    padding: 20px 22px;
    box-shadow: 0 4px 24px rgba(0,0,0,.4);
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-width: 280px;
    max-width: 340px;
    flex: 1;
  }
  .panel h2 {
    font-size: 1.1rem;
    color: #fff;
    border-bottom: 1px solid #2a2a4a;
    padding-bottom: 8px;
  }

  /* Preset buttons */
  .preset-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .preset-btn {
    flex: 1;
    min-width: 60px;
    padding: 8px 10px;
    border: 1px solid #3a3a5a;
    border-radius: 8px;
    background: #1a1a35;
    color: #ccc;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
    text-align: center;
  }
  .preset-btn:hover {
    border-color: #7b6cf6;
    color: #fff;
    background: #222250;
  }
  .preset-btn.active {
    border-color: #7b6cf6;
    background: #2a2a5a;
    color: #fff;
    box-shadow: 0 0 12px rgba(123,108,246,.25);
  }

  /* Sliders */
  .slider-group { display: flex; flex-direction: column; gap: 6px; }
  .slider-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    color: #aaa;
  }
  .slider-label span:last-child {
    color: #ddd;
    font-variant-numeric: tabular-nums;
    font-family: "SF Mono", "Cascadia Code", monospace;
  }
  input[type=range] {
    width: 100%;
    accent-color: #7b6cf6;
  }

  /* Matrix display */
  .matrix-display {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
    font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
    font-size: 0.95rem;
    background: #0f0f23;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }
  .matrix-display .col-header {
    font-size: 0.7rem;
    color: #888;
    padding-bottom: 2px;
  }
  .matrix-display .val {
    padding: 4px 6px;
    border-radius: 4px;
    font-weight: 600;
  }
  .matrix-display .val.col0 { color: #ff6b6b; }
  .matrix-display .val.col1 { color: #4ecdc4; }

  /* Legend */
  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 0.8rem;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }
  .legend-dot.ihat { background: #ff6b6b; }
  .legend-dot.jhat { background: #4ecdc4; }
  .legend-dot.sample { background: #f9ca24; }

  /* Drag hint */
  .hint {
    font-size: 0.75rem;
    color: #666;
    text-align: center;
    margin-top: -4px;
  }
</style>
</head>
<body>

<h1>基向量变换 · 交互演示</h1>
<p class="subtitle">拖动紫色向量 · 点击预设动画 · 观察矩阵如何改变基向量</p>

<div class="main-container">
  <!-- Canvas -->
  <div class="canvas-wrapper">
    <canvas id="canvas" width="500" height="500"></canvas>
  </div>

  <!-- Controls -->
  <div class="panel">
    <h2>🎬 预设变换</h2>
    <div class="preset-row">
      <button class="preset-btn active" data-preset="identity">单位矩阵</button>
      <button class="preset-btn" data-preset="scale2x">2× 缩放</button>
      <button class="preset-btn" data-preset="rotate45">旋转 45°</button>
    </div>
    <div class="preset-row">
      <button class="preset-btn" data-preset="shear">切变</button>
      <button class="preset-btn" data-preset="reflectY">Y 轴翻转</button>
      <button class="preset-btn" data-preset="projectX">投影到 X</button>
    </div>

    <h2>🎯 矩阵参数</h2>
    <div class="slider-group">
      <div class="slider-label"><span>i-hat → x</span><span id="val-a">1.00</span></div>
      <input type="range" id="slider-a" min="-3" max="3" step="0.01" value="1">
    </div>
    <div class="slider-group">
      <div class="slider-label"><span>i-hat → y</span><span id="val-b">0.00</span></div>
      <input type="range" id="slider-b" min="-3" max="3" step="0.01" value="0">
    </div>
    <div class="slider-group">
      <div class="slider-label"><span>j-hat → x</span><span id="val-c">0.00</span></div>
      <input type="range" id="slider-c" min="-3" max="3" step="0.01" value="0">
    </div>
    <div class="slider-group">
      <div class="slider-label"><span>j-hat → y</span><span id="val-d">1.00</span></div>
      <input type="range" id="slider-d" min="-3" max="3" step="0.01" value="1">
    </div>

    <h2>📐 当前矩阵</h2>
    <div class="matrix-display">
      <div class="col-header" style="color:#ff6b6b">i-hat 列</div>
      <div class="col-header" style="color:#4ecdc4">j-hat 列</div>
      <div class="val col0" id="disp-a">1.00</div>
      <div class="val col1" id="disp-c">0.00</div>
      <div class="val col0" id="disp-b">0.00</div>
      <div class="val col1" id="disp-d">1.00</div>
    </div>

    <div class="legend">
      <div class="legend-item"><span class="legend-dot ihat"></span> i-hat</div>
      <div class="legend-item"><span class="legend-dot jhat"></span> j-hat</div>
      <div class="legend-item"><span class="legend-dot sample"></span> 样本向量</div>
    </div>
    <p class="hint">💡 拖拽紫色圆点移动样本向量</p>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const ORIGIN_X = W / 2;
  const ORIGIN_Y = H / 2;
  const SCALE = 70;       // pixels per unit
  const ARROW_SIZE = 10;

  // ---- State ----
  let targetMatrix = [1, 0, 0, 1];  // [a, b, c, d]  column-major for display
  let currentMatrix = [1, 0, 0, 1];
  let sampleVec = [2, 1.5];          // draggable sample vector

  // ---- Coordinate helpers ----
  function toScreen(x, y) {
    return [ORIGIN_X + x * SCALE, ORIGIN_Y - y * SCALE];
  }
  function toWorld(sx, sy) {
    return [(sx - ORIGIN_X) / SCALE, (ORIGIN_Y - sy) / SCALE];
  }

  // ---- Transform a vector by a matrix ----
  function applyMatrix(m, v) {
    // m = [a, b, c, d]  where a,b = col0 (i-hat), c,d = col1 (j-hat)
    return [
      m[0] * v[0] + m[2] * v[1],
      m[1] * v[0] + m[3] * v[1]
    ];
  }

  // ---- Draw an arrow ----
  function drawArrow(fromX, fromY, toX, toY, color, width) {
    const dx = toX - fromX;
    const dy = toY - fromY;
    const len = Math.sqrt(dx * dx + dy * dy);
    if (len < 0.5) return;

    const ux = dx / len;
    const uy = dy / len;

    // Shaft
    ctx.beginPath();
    ctx.moveTo(fromX, fromY);
    ctx.lineTo(toX, toY);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.stroke();

    // Arrowhead
    const tipX = toX;
    const tipY = toY;
    const baseX = tipX - ux * ARROW_SIZE * 1.6;
    const baseY = tipY - uy * ARROW_SIZE * 1.6;
    const leftX = baseX - uy * ARROW_SIZE;
    const leftY = baseY + ux * ARROW_SIZE;
    const rightX = baseX + uy * ARROW_SIZE;
    const rightY = baseY - ux * ARROW_SIZE;

    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(leftX, leftY);
    ctx.lineTo(rightX, rightY);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  // ---- Draw grid ----
  function drawGrid(matrix) {
    // Draw transformed grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;

    const range = 5;
    // Vertical-ish lines (lines of constant original-x)
    for (let x = -range; x <= range; x++) {
      ctx.beginPath();
      for (let t = -range; t <= range; t += 0.1) {
        const [sx, sy] = toScreen(...applyMatrix(matrix, [x, t]));
        if (t === -range) ctx.moveTo(sx, sy);
        else ctx.lineTo(sx, sy);
      }
      ctx.stroke();
    }
    // Horizontal-ish lines (lines of constant original-y)
    for (let y = -range; y <= range; y++) {
      ctx.beginPath();
      for (let t = -range; t <= range; t += 0.1) {
        const [sx, sy] = toScreen(...applyMatrix(matrix, [t, y]));
        if (t === -range) ctx.moveTo(sx, sy);
        else ctx.lineTo(sx, sy);
      }
      ctx.stroke();
    }
  }

  // ---- Draw axes (original coordinate axes, dimmed) ----
  function drawOriginalAxes() {
    const alpha = 0.18;
    ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 8]);

    // X axis
    ctx.beginPath();
    ctx.moveTo(20, ORIGIN_Y);
    ctx.lineTo(W - 20, ORIGIN_Y);
    ctx.stroke();
    // Y axis
    ctx.beginPath();
    ctx.moveTo(ORIGIN_X, 20);
    ctx.lineTo(ORIGIN_X, H - 20);
    ctx.stroke();

    ctx.setLineDash([]);
  }

  // ---- Main draw ----
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Background
    ctx.fillStyle = '#1a1a30';
    ctx.fillRect(0, 0, W, H);

    // Transformed grid
    drawGrid(currentMatrix);

    // Original axes (faint)
    drawOriginalAxes();

    // Transformed basis vectors
    const i_end = toScreen(currentMatrix[0], currentMatrix[1]);
    const j_end = toScreen(currentMatrix[2], currentMatrix[3]);

    drawArrow(ORIGIN_X, ORIGIN_Y, i_end[0], i_end[1], '#ff6b6b', 3.5);
    drawArrow(ORIGIN_X, ORIGIN_Y, j_end[0], j_end[1], '#4ecdc4', 3.5);

    // Transformed sample vector
    const tSample = applyMatrix(currentMatrix, sampleVec);
    const s_end = toScreen(tSample[0], tSample[1]);
    drawArrow(ORIGIN_X, ORIGIN_Y, s_end[0], s_end[1], '#f9ca24', 2.8);

    // ---- Draw original sample vector (ghost) ----
    const os_end = toScreen(sampleVec[0], sampleVec[1]);
    ctx.strokeStyle = 'rgba(249,202,36,0.18)';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(ORIGIN_X, ORIGIN_Y);
    ctx.lineTo(os_end[0], os_end[1]);
    ctx.stroke();
    ctx.setLineDash([]);

    // ---- Sample vector drag handle ----
    const [hx, hy] = toScreen(sampleVec[0], sampleVec[1]);
    ctx.beginPath();
    ctx.arc(hx, hy, 10, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(249,202,36,0.25)';
    ctx.fill();
    ctx.strokeStyle = '#f9ca24';
    ctx.lineWidth = 2;
    ctx.stroke();

    // ---- Origin dot ----
    ctx.beginPath();
    ctx.arc(ORIGIN_X, ORIGIN_Y, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();

    // ---- Labels ----
    ctx.font = 'bold 14px "SF Mono", "Cascadia Code", "Consolas", monospace';
    ctx.textAlign = 'center';

    // i-hat label
    const ilx = i_end[0] + (i_end[0] - ORIGIN_X) * 0.12;
    const ily = i_end[1] + (i_end[1] - ORIGIN_Y) * 0.12;
    ctx.fillStyle = '#ff6b6b';
    ctx.fillText('î', ilx, ily - 6);

    // j-hat label
    const jlx = j_end[0] + (j_end[0] - ORIGIN_X) * 0.12;
    const jly = j_end[1] + (j_end[1] - ORIGIN_Y) * 0.12;
    ctx.fillStyle = '#4ecdc4';
    ctx.fillText('ĵ', jlx, jly - 6);

    // Sample vector label
    const slx = s_end[0] + (s_end[0] - ORIGIN_X) * 0.12;
    const sly = s_end[1] + (s_end[1] - ORIGIN_Y) * 0.12;
    ctx.fillStyle = '#f9ca24';
    ctx.fillText('v', slx, sly - 6);
  }

  // ---- Animation loop ----
  const LERP = 0.12;
  function animate() {
    let changed = false;
    for (let i = 0; i < 4; i++) {
      if (Math.abs(currentMatrix[i] - targetMatrix[i]) > 0.0005) {
        currentMatrix[i] += (targetMatrix[i] - currentMatrix[i]) * LERP;
        changed = true;
      } else {
        currentMatrix[i] = targetMatrix[i];
      }
    }
    draw();
    if (changed) {
      // Update display values during animation too
      updateDisplay();
    }
    requestAnimationFrame(animate);
  }

  // ---- Update numeric displays ----
  function updateDisplay() {
    const m = currentMatrix;
    document.getElementById('val-a').textContent = m[0].toFixed(2);
    document.getElementById('val-b').textContent = m[1].toFixed(2);
    document.getElementById('val-c').textContent = m[2].toFixed(2);
    document.getElementById('val-d').textContent = m[3].toFixed(2);
    document.getElementById('disp-a').textContent = m[0].toFixed(2);
    document.getElementById('disp-b').textContent = m[1].toFixed(2);
    document.getElementById('disp-c').textContent = m[2].toFixed(2);
    document.getElementById('disp-d').textContent = m[3].toFixed(2);
  }

  // ---- Sync sliders to current target matrix ----
  function syncSliders() {
    document.getElementById('slider-a').value = targetMatrix[0];
    document.getElementById('slider-b').value = targetMatrix[1];
    document.getElementById('slider-c').value = targetMatrix[2];
    document.getElementById('slider-d').value = targetMatrix[3];
  }

  // ---- Presets ----
  const presets = {
    identity:    { matrix: [1, 0, 0, 1], label: '单位矩阵' },
    scale2x:     { matrix: [2, 0, 0, 2], label: '2× 缩放' },
    rotate45:    { matrix: [0.7071, 0.7071, -0.7071, 0.7071], label: '旋转 45°' },
    shear:       { matrix: [1, 0, 0.8, 1], label: '切变' },
    reflectY:    { matrix: [1, 0, 0, -1], label: 'Y 轴翻转' },
    projectX:    { matrix: [1, 0, 0, 0], label: '投影到 X' },
  };

  function applyPreset(name) {
    const p = presets[name];
    if (!p) return;
    targetMatrix = [...p.matrix];
    syncSliders();

    // Highlight active button
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-preset="${name}"]`)?.classList.add('active');
  }

  // ---- Event: preset buttons ----
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      applyPreset(btn.dataset.preset);
    });
  });

  // ---- Event: sliders ----
  const sliderIds = ['slider-a', 'slider-b', 'slider-c', 'slider-d'];
  sliderIds.forEach((id, idx) => {
    document.getElementById(id).addEventListener('input', (e) => {
      targetMatrix[idx] = parseFloat(e.target.value);
      // Deactivate preset buttons
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    });
  });

  // ---- Event: drag sample vector ----
  let dragging = false;
  function getSampleHandleDist(sx, sy) {
    const [hx, hy] = toScreen(sampleVec[0], sampleVec[1]);
    return Math.sqrt((sx - hx) ** 2 + (sy - hy) ** 2);
  }

  canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const sx = (e.clientX - rect.left) * (W / rect.width);
    const sy = (e.clientY - rect.top) * (H / rect.height);
    if (getSampleHandleDist(sx, sy) < 16) {
      dragging = true;
      canvas.style.cursor = 'grabbing';
    }
  });

  window.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const sx = (e.clientX - rect.left) * (W / rect.width);
    const sy = (e.clientY - rect.top) * (H / rect.height);

    if (dragging) {
      const [wx, wy] = toWorld(sx, sy);
      // Clamp to reasonable range
      sampleVec[0] = Math.round(wx * 100) / 100;
      sampleVec[1] = Math.round(wy * 100) / 100;
    } else {
      canvas.style.cursor = getSampleHandleDist(sx, sy) < 16 ? 'grab' : 'default';
    }
  });

  window.addEventListener('mouseup', () => {
    dragging = false;
    canvas.style.cursor = 'default';
  });

  // Touch support
  canvas.addEventListener('touchstart', (e) => {
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    const sx = (touch.clientX - rect.left) * (W / rect.width);
    const sy = (touch.clientY - rect.top) * (H / rect.height);
    if (getSampleHandleDist(sx, sy) < 20) {
      dragging = true;
      e.preventDefault();
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    const sx = (touch.clientX - rect.left) * (W / rect.width);
    const sy = (touch.clientY - rect.top) * (H / rect.height);
    const [wx, wy] = toWorld(sx, sy);
    sampleVec[0] = Math.round(wx * 100) / 100;
    sampleVec[1] = Math.round(wy * 100) / 100;
  }, { passive: false });

  canvas.addEventListener('touchend', () => { dragging = false; });

  // ---- Start ----
  syncSliders();
  updateDisplay();
  animate();
})();
</script>
</body>
</html>
