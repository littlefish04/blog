<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="auto">
  <defs>
    <marker id="arrow-black" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="500" y="32" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a">
    练习 5.6 Horner 方法：每轮 result = result * x + a[i]
  </text>

  <!-- 输入 x -->
  <g>
    <rect x="70" y="60" width="100" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="120" y="91" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a">x</text>
  </g>

  <!-- 当前 result -->
  <g>
    <rect x="70" y="170" width="150" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="145" y="197" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="16" fill="#713f12">result</text>
    <text x="145" y="218" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13" fill="#713f12">(来自上一轮)</text>
  </g>

  <!-- 输入 a[i] -->
  <g>
    <rect x="70" y="300" width="100" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="120" y="331" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a">a[i]</text>
  </g>

  <!-- 乘法节点 -->
  <g>
    <rect x="330" y="140" width="180" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="420" y="172" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="16" fill="#7f1d1d">乘法</text>
    <text x="420" y="196" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="16" fill="#7f1d1d">result * x</text>
    <text x="420" y="216" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12" fill="#7f1d1d">延迟 5</text>
  </g>

  <!-- 加法节点 -->
  <g>
    <rect x="610" y="160" width="180" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="700" y="192" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="16" fill="#1e3a8a">加法</text>
    <text x="700" y="216" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="16" fill="#1e3a8a">+ a[i]</text>
    <text x="700" y="236" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e3a8a">延迟 3</text>
  </g>

  <!-- 下一轮 result -->
  <g>
    <rect x="840" y="175" width="140" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="910" y="200" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="15" fill="#14532d">result_next</text>
    <text x="910" y="220" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12" fill="#14532d">到下一轮</text>
  </g>

  <!-- 普通数据流：x -> 乘法 -->
  <path d="M170,85 H250 V185 H330" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow-black)"/>

  <!-- 普通数据流：a[i] -> 加法 -->
  <path d="M170,325 H560 V225 H610" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow-black)"/>

  <!-- 关键路径：result -> 乘法 -->
  <path d="M220,205 H330" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow-red)"/>

  <!-- 关键路径：乘法 -> 加法 -->
  <path d="M510,185 H610" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow-red)"/>

  <!-- 关键路径：加法 -> result_next -->
  <path d="M790,205 H840" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow-red)"/>

  <!-- 循环携带依赖：result_next 回到下一轮的 result -->
  <path d="M910,235 V400 H145 V240" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-red)"/>

  <!-- 说明文字 -->
  <text x="500" y="455" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="14" fill="#dc2626">
    红色粗线：循环携带关键路径 result → result*x → +a[i] → result_next，延迟 = 5 + 3 = 8 周期
  </text>
</svg>