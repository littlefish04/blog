<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 520" width="100%" height="auto">
  <defs>
    <marker id="arrow-black" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1050" height="520" fill="#ffffff"/>

  <!-- 节点：输入 x -->
  <g>
    <rect x="50" y="70" width="80" height="44" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="90" y="97" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a">x</text>
  </g>

  <!-- 节点：输入 a[i] -->
  <g>
    <rect x="50" y="240" width="80" height="44" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="90" y="267" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="18" fill="#0f172a">a[i]</text>
  </g>

  <!-- 节点：当前 xpwr -->
  <g>
    <rect x="170" y="145" width="160" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="250" y="170" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="16" fill="#713f12">xpwr</text>
    <text x="250" y="190" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13" fill="#713f12">(来自上一轮)</text>
  </g>

  <!-- 节点：当前 result -->
  <g>
    <rect x="170" y="360" width="160" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="250" y="385" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="16" fill="#14532d">result</text>
    <text x="250" y="405" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13" fill="#14532d">(来自上一轮)</text>
  </g>

  <!-- 节点：乘法 x * xpwr -->
  <g>
    <rect x="400" y="80" width="160" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="480" y="105" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="16" fill="#7f1d1d">乘法</text>
    <text x="480" y="126" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="15" fill="#7f1d1d">x * xpwr</text>
    <text x="480" y="143" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12" fill="#7f1d1d">延迟 5</text>
  </g>

  <!-- 节点：乘法 a[i] * xpwr -->
  <g>
    <rect x="400" y="240" width="160" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="480" y="265" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="16" fill="#7f1d1d">乘法</text>
    <text x="480" y="286" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="15" fill="#7f1d1d">a[i] * xpwr</text>
    <text x="480" y="303" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12" fill="#7f1d1d">延迟 5</text>
  </g>

  <!-- 节点：加法 result + t -->
  <g>
    <rect x="640" y="350" width="160" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="720" y="375" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="16" fill="#1e3a8a">加法</text>
    <text x="720" y="396" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="15" fill="#1e3a8a">result + t</text>
    <text x="720" y="413" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12" fill="#1e3a8a">延迟 3</text>
  </g>

  <!-- 节点：xpwr_next -->
  <g>
    <rect x="640" y="80" width="160" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="720" y="105" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="16" fill="#713f12">xpwr_next</text>
    <text x="720" y="125" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13" fill="#713f12">到下一轮</text>
  </g>

  <!-- 节点：result_next -->
  <g>
    <rect x="860" y="350" width="160" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="940" y="375" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="16" fill="#14532d">result_next</text>
    <text x="940" y="395" text-anchor="middle" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13" fill="#14532d">到下一轮</text>
  </g>

  <!-- 下一轮循环依赖：xpwr 关键环 -->
  <path d="M800,110 H830 V40 H250 V145" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-red)"/>

  <!-- 下一轮循环依赖：result 环 -->
  <path d="M940,410 V470 H250 V420" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-blue)"/>

  <!-- 普通数据流箭头 -->
  <path d="M130,92 H265 V115 H400" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow-black)"/>
  <path d="M130,262 H265 V275 H400" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow-black)"/>
  <path d="M330,175 C365,175 365,275 400,275" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow-black)"/>
  <path d="M560,275 C600,275 600,385 640,385" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow-black)"/>

  <!-- result 链：蓝色 -->
  <path d="M330,390 H640" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M800,385 H860" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <!-- 关键路径：xpwr -> x*xpwr -> xpwr_next，红色 -->
  <path d="M330,175 C365,175 365,115 400,115" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>
  <path d="M560,115 H640" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>

  <!-- 边标签 -->
  <text x="575" y="320" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">t = a[i] * xpwr</text>
  <text x="430" y="65" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13" fill="#dc2626">下一轮 xpwr（关键环：5 周期）</text>
  <text x="520" y="490" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13" fill="#2563eb">下一轮 result（环：3 周期）</text>
</svg>